<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada · Vigente</title>
<meta name="description" content="La página que buscas no existe o ha cambiado de dirección.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B231D">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Mona Sans"; src: url("/assets/fonts/mona-sans.woff2") format("woff2"); font-weight: 300 720; font-stretch: 100% 125%; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("/assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root { --night: #0B231D; --snow: #EAF1ED; --snow-2: #B2C4BB; --mint: #8BE0BA; --red-glow: #F7A08B; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--night);
    color: var(--snow);
    font-family: "Mona Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(100%, 720px); }
  .code { font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--red-glow); display: inline-flex; align-items: center; gap: 10px; }
  .code::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  h1 { margin: 22px 0 0; font-size: clamp(2.5rem, 1.4rem + 5vw, 5rem); font-weight: 620; font-stretch: 112%; letter-spacing: -.045em; line-height: .98; text-wrap: balance; }
  p { margin: 20px 0 0; max-width: 44ch; color: var(--snow-2); font-size: 1.125rem; }
  a.btn { margin-top: 32px; display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 26px; border-radius: 999px; background: var(--mint); color: var(--night); font-weight: 600; text-decoration: none; transition: box-shadow .3s; }
  a.btn:hover { box-shadow: 0 14px 34px -14px rgb(139 224 186 / .6); }
  a.btn:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<main>
  <p class="code">Error 404 · Caducada</p>
  <h1>Esta página ha caducado.</h1>
  <p>No la encontramos: puede que haya cambiado de dirección o que nunca haya existido. Por suerte, con los reconocimientos de tu plantilla no pasa lo mismo.</p>
  <a class="btn" href="/">Volver al inicio <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></svg></a>
</main>
</body>
</html>
